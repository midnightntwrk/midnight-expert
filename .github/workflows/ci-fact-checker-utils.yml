name: CI - Fact Checker Utils

on:
  pull_request:
    branches: ['**']
    paths:
      - 'packages/midnight-fact-checker-utils/**'
  push:
    branches:
      - main
    paths:
      - 'packages/midnight-fact-checker-utils/**'

defaults:
  run:
    working-directory: packages/midnight-fact-checker-utils

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/midnight-fact-checker-utils/package-lock.json
      - run: npm ci
      - name: Biome check
        run: npx biome check .
        working-directory: .

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/midnight-fact-checker-utils/package-lock.json
      - run: npm ci
      - name: Biome format check
        run: npx biome format .
        working-directory: .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/midnight-fact-checker-utils/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/midnight-fact-checker-utils/package-lock.json
      - run: npm ci
      - run: npx tsc

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/midnight-fact-checker-utils/package-lock.json
      - run: npm ci
      - run: npx vitest run

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/midnight-fact-checker-utils/package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: Inspect tarball contents
        run: npm pack --dry-run

name: Publish - Template Engine

on:
  push:
    branches:
      - main
    paths:
      - 'packages/template-engine/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if version is unchanged (use with caution)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: packages/template-engine

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/template-engine/package-lock.json

      - name: Check if version changed
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "${PACKAGE_NAME}" version 2>/dev/null || echo "0.0.0")

          echo "local=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "published=${PUBLISHED_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Force publish requested: ${LOCAL_VERSION}"
          elif [ "${LOCAL_VERSION}" != "${PUBLISHED_VERSION}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: ${PUBLISHED_VERSION} -> ${LOCAL_VERSION}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: ${LOCAL_VERSION}"
          fi

      - name: Install dependencies
        if: steps.version-check.outputs.changed == 'true'
        run: npm ci

      - name: Audit (block on high+ severity)
        if: steps.version-check.outputs.changed == 'true'
        run: npm audit --audit-level=high

      - name: Run tests
        if: steps.version-check.outputs.changed == 'true'
        run: npx vitest run

      - name: Type check
        if: steps.version-check.outputs.changed == 'true'
        run: npx tsc --noEmit

      - name: Build
        if: steps.version-check.outputs.changed == 'true'
        run: npx tsc

      - name: Lock dependency tree for publish (npm-shrinkwrap.json)
        if: steps.version-check.outputs.changed == 'true'
        # template-engine has no runtime dependencies — shrinkwrap is
        # still emitted so consumers see an empty, signed dep tree
        # rather than relying on the package.json on every install.
        run: cp package-lock.json npm-shrinkwrap.json

      - name: Inspect tarball contents
        if: steps.version-check.outputs.changed == 'true'
        run: npm pack --dry-run

      - name: Upgrade npm for trusted publishing (OIDC needs npm >= 11.5.1)
        if: steps.version-check.outputs.changed == 'true'
        run: npm install -g npm@12.0.2

      - name: Publish to npm with provenance
        if: steps.version-check.outputs.changed == 'true'
        run: npm publish --provenance --access public
